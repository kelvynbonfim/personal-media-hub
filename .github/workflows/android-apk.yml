name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck and tests
        run: |
          npx tsc --noEmit
          npx jest

      - name: Generate Android project via Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-media-hub-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e "console.log(require('./version.json').version)")
          NOTES=$(node -e "console.log(require('./version.json').releaseNotes || 'Nova atualização disponível.')")
          cp android/app/build/outputs/apk/release/*.apk ./app-release.apk
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./app-release.apk --clobber
          else
            gh release create "$TAG" ./app-release.apk --title "Personal Media Hub ${TAG}" --notes "$NOTES"
          fi
